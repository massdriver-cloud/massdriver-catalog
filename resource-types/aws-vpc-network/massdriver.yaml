name: aws-vpc-network
version: 0.0.0
label: AWS VPC Network
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/refs/heads/aws-citizen-developer-catalog/resource-types/aws-vpc-network/icon.svg

ui:
  connectionOrientation: link

schema:
  title: AWS VPC Network
  description: A private network in AWS that applications and databases run inside of.
  type: object
  additionalProperties: false
  required:
    - vpc_id
    - region
    - cidr
    - availability_zones
  properties:
    vpc_id:
      title: VPC ID
      description: Cloud identifier for the network.
      type: string
      minLength: 1
      examples:
        - vpc-0a1b2c3d4e5f67890
    region:
      title: Region
      description: Region the network lives in. Everything attached to it must be in this region.
      type: string
      minLength: 1
    cidr:
      title: Address Range
      description: The full range of private addresses this network owns.
      type: string
      minLength: 1
      examples:
        - 10.0.0.0/16
    availability_zones:
      title: Availability Zones
      description: The zones the network spans. Anything highly available needs at least two.
      type: array
      minItems: 1
      items:
        type: string
    public_subnet_ids:
      title: Public Subnets
      description: Subnets that can reach the internet directly. Load balancers go here.
      type: array
      items:
        type: string
    private_subnet_ids:
      title: Private Subnets
      description: Subnets with no direct route in from the internet. Applications go here.
      type: array
      items:
        type: string
    unused_cidr_blocks:
      title: Free Address Space
      description: >-
        Ranges inside the network that nothing has claimed yet. A landing zone takes its slice
        from here.
      type: array
      items:
        type: string
