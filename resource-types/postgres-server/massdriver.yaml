name: postgres-server
label: Postgres Server
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/main/bundles/aws-rds-postgres/icon.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: databases
  instructions:
    - label: AWS RDS PostgreSQL
      path: ./instructions/AWS RDS PostgreSQL.md

schema:
  title: Postgres Server
  description: >-
    Connection host, port, and credentials for a PostgreSQL server. Portable
    across any Postgres-wire-compatible engine (RDS, Aurora, Cloud SQL,
    Azure Database for PostgreSQL, self-hosted).
  type: object
  additionalProperties: false
  required:
    - id
    - engine
    - region
    - auth
  properties:
    id:
      title: ID
      description: Unique server/cluster identifier from the cloud provider.
      type: string
      minLength: 1
    engine:
      title: Engine
      description: The underlying Postgres engine implementation.
      type: string
      oneOf:
        - const: "rds-postgres"
          title: "Amazon RDS for PostgreSQL"
        - const: "aurora-postgresql"
          title: "Amazon Aurora PostgreSQL"
    version:
      title: Version
      description: PostgreSQL major version (e.g. 16).
      type: string
    region:
      title: Region
      description: Cloud region the server runs in.
      type: string
    high_availability:
      title: High Availability
      description: Whether the server is deployed with a standby / multi-AZ replica.
      type: boolean
    auth:
      title: Authentication
      description: Database connection parameters.
      type: object
      additionalProperties: false
      required:
        - hostname
        - port
        - database
        - username
        - password
      properties:
        hostname:
          title: Host
          description: Database server hostname.
          type: string
          minLength: 1
        port:
          title: Port
          description: TCP port the database listens on.
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          title: Database
          description: Default database name to connect to.
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          message:
            pattern: "Must start with a letter or underscore, then letters, digits, or underscores."
        username:
          title: Username
          description: Authentication username.
          type: string
          minLength: 1
        password:
          $md.sensitive: true
          $md.copyable: false
          title: Password
          description: Authentication password. Masked everywhere except in IaC at deploy time.
          type: string
