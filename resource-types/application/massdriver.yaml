name: application
label: Application
icon: https://unpkg.com/lucide-static@0.562.0/icons/app-window.svg

ui:
  connectionOrientation: link
  instructions:
    - label: Manual Entry
      path: ./instructions/Manual Entry.md

schema:
  title: Application
  description: >-
    A deployed application's public identity — where it's reachable and how to check its health. Produced by
    application bundles (like `k8s-wordpress` or bundles built by the Massdriver architect).
  type: object
  additionalProperties: false
  required:
    - id
  properties:
    id:
      title: Application ID
      description: Unique identifier for the deployed application (a Kubernetes workload ID, function ARN, etc.).
      type: string
      minLength: 1
    url:
      title: URL
      description: Public or internal URL where the application is reachable.
      type: string
      format: uri
      examples:
        - "https://dashboard.internal.example.com"
    health_path:
      title: Health Check Path
      description: HTTP path that returns 200 when the application is healthy.
      type: string
      default: /
      examples:
        - /healthz
