name: container-registry
label: Container Registry
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/main/bundles/gcp-artifact-registry/icon.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: registry
  instructions:
    - label: GCP Artifact Registry
      path: ./instructions/GCP Artifact Registry.md

schema:
  title: Container Registry
  description: An OCI image registry that workloads pull container images from.
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - registry_url
    - policies
  properties:
    id:
      title: ID
      description: Unique resource identifier from the cloud provider (e.g. a full resource name or selfLink).
      type: string
      minLength: 1
    name:
      title: Name
      description: Repository name within the registry.
      type: string
      minLength: 2
      maxLength: 63
      pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
      message:
        pattern: "2–63 lowercase characters, digits, or hyphens. Must start and end with a letter or digit."
    registry_url:
      title: Registry URL
      description: Host and path images are pushed to and pulled from, without a scheme or tag.
      type: string
      minLength: 1
      examples:
        - us-central1-docker.pkg.dev/my-project/my-repo
    location:
      title: Location
      description: Cloud region or multi-region the registry lives in.
      type: string
    format:
      title: Format
      description: Artifact format the repository stores.
      type: string
      default: DOCKER
      examples:
        - DOCKER
    policies:
      title: Access Policies
      description: IAM-style access policies the producing bundle exposes for consumers to pick from.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            title: ID
            description: Policy identifier. For GCP this is the IAM role a consumer gets bound to.
            type: string
            minLength: 1
          name:
            title: Name
            description: Human-readable policy name.
            type: string
            minLength: 1
