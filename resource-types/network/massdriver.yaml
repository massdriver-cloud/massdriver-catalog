name: network
label: Network
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/main/bundles/gcp-network/icon.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: networks

schema:
  title: Network
  description: A private network with subnet allocations and (optionally) private service access peering for managed databases.
  type: object
  additionalProperties: false
  required:
    - id
    - self_link
    - name
    - project_id
    - cidr
    - subnets
  properties:
    id:
      title: ID
      description: Full resource name of the network (e.g. projects/p/global/networks/n).
      type: string
      minLength: 1
    self_link:
      title: Self Link
      description: Fully qualified GCP self-link. Required by resources that attach to this network (e.g. Cloud SQL private IP, VPC connectors).
      type: string
      minLength: 1
    name:
      title: Name
      description: Network name within the project.
      type: string
      minLength: 1
    project_id:
      title: Project ID
      description: GCP project the network lives in.
      type: string
      minLength: 1
    cidr:
      title: CIDR
      description: Primary IPv4 address range for the network.
      type: string
      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
      message:
        pattern: "Must be a valid IPv4 CIDR block, like 10.0.0.0/16."
    private_service_access:
      title: Private Service Access
      description: Whether a Google-managed services peering range is reserved on this network, required before a Cloud SQL instance can use a private IP.
      type: boolean
    subnets:
      title: Subnets
      description: Subnet allocations carved from this network.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - self_link
          - name
          - region
          - cidr
        properties:
          id:
            title: ID
            description: Full resource name of the subnet.
            type: string
            minLength: 1
          self_link:
            title: Self Link
            description: Fully qualified GCP self-link for the subnet.
            type: string
            minLength: 1
          name:
            title: Name
            description: Subnet name.
            type: string
            minLength: 1
          region:
            title: Region
            description: Region the subnet lives in.
            type: string
            minLength: 1
          cidr:
            title: CIDR
            description: Primary IPv4 range of the subnet.
            type: string
            pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
            message:
              pattern: "Must be a valid IPv4 CIDR block."
          secondary_ranges:
            title: Secondary Ranges
            description: Named secondary IP ranges on this subnet (e.g. for GKE pod/service ranges).
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - cidr
              properties:
                name:
                  type: string
                  minLength: 1
                cidr:
                  type: string
                  pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
