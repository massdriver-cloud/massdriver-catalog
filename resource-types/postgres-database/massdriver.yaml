name: postgres-database
label: PostgreSQL Database
icon: https://unpkg.com/lucide-static@0.562.0/icons/database.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: databases
  instructions:
    - label: AWS RDS PostgreSQL
      path: ./instructions/AWS RDS PostgreSQL.md

schema:
  title: PostgreSQL Database
  description: A PostgreSQL database with connection details and access policies. Produced by the `aws-rds-postgres` bundle; consumed by applications that need a relational database.
  type: object
  additionalProperties: false
  required:
    - id
    - auth
    - policies
  properties:
    id:
      title: Database ID
      description: Unique identifier for the database instance (on AWS, the RDS instance ARN).
      type: string
      minLength: 1
    version:
      title: PostgreSQL Version
      description: Major version of the running server.
      type: string
      examples:
        - "16"
    high_availability:
      title: High Availability
      description: Whether the instance runs with a standby replica.
      type: boolean
    auth:
      title: Authentication
      description: Database connection parameters.
      type: object
      additionalProperties: false
      required:
        - hostname
        - port
        - database
        - username
        - password
      properties:
        hostname:
          title: Host
          description: Database server hostname.
          type: string
          minLength: 1
        port:
          title: Port
          description: TCP port the database listens on.
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          title: Database
          description: Default database name to connect to.
          type: string
          pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          message:
            pattern: "Must start with a letter or underscore, then letters, digits, or underscores."
        username:
          title: Username
          description: Authentication username.
          type: string
          minLength: 1
        password:
          $md.sensitive: true
          title: Password
          description: Authentication password. Masked in the UI; downloads are audit-logged.
          type: string
    policies:
      title: Access Policies
      description: Access levels applications can request. Bundles use `$md.enum` against this list to offer a policy dropdown.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            title: Policy ID
            type: string
          name:
            title: Policy Name
            type: string
