name: postgres-database
version: 0.0.0
label: PostgreSQL Database
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/example/0921-azure-landing-zones/bundles/azure-postgres-flexible-server/icon.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: databases
  instructions:
    - label: Azure Database for PostgreSQL
      path: ./instructions/Azure Database for PostgreSQL.md

schema:
  title: PostgreSQL Database
  description: A PostgreSQL database, with the values that an application needs to connect to it.
  type: object
  additionalProperties: false
  required:
    - id
    - auth
    - policies
  properties:
    id:
      title: ID
      description: The full identifier of the database server in the cloud provider.
      type: string
      minLength: 1
    auth:
      title: Connection
      description: The values that an application needs to open a connection.
      type: object
      additionalProperties: false
      required:
        - hostname
        - port
        - database
        - username
        - password
      properties:
        hostname:
          title: Host
          description: The name of the database server.
          type: string
          minLength: 1
        port:
          title: Port
          description: The TCP port of the database server.
          type: integer
          minimum: 1
          maximum: 65535
          default: 5432
        database:
          title: Database
          description: The name of the database.
          type: string
          minLength: 1
        username:
          title: Username
          description: The name of the application user.
          type: string
          minLength: 1
        password:
          $md.sensitive: true
          $md.copyable: false
          title: Password
          description: The password of the application user. Massdriver masks it everywhere except in the code at deployment time.
          type: string
    version:
      title: Version
      description: The major version of PostgreSQL.
      type: string
    high_availability:
      title: High Availability
      description: True when a standby server in a second zone takes over after a failure.
      type: boolean
    policies:
      title: Access Policies
      description: The access levels that a consumer can select.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            title: ID
            description: The identifier of the policy. A bundle maps it to a set of grants.
            type: string
            minLength: 1
          name:
            title: Name
            description: The name that a developer reads in the form.
            type: string
            minLength: 1
