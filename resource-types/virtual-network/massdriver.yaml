name: virtual-network
version: 0.0.0
label: Virtual Network
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/example/0921-azure-landing-zones/bundles/azure-virtual-network/icon.svg

ui:
  connectionOrientation: link
  environmentDefaultGroup: networks
  instructions:
    - label: Azure VNet
      path: ./instructions/Azure VNet.md

schema:
  title: Virtual Network
  description: A virtual network and its subnets. Workloads attach to a subnet by name.
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - cidr
    - region
    - subnets
  properties:
    id:
      title: ID
      description: The full identifier of the network in the cloud provider.
      type: string
      minLength: 1
    name:
      title: Name
      description: The name of the network.
      type: string
      minLength: 1
    cidr:
      title: CIDR
      description: The address range of the network, in CIDR notation.
      type: string
      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
      message:
        pattern: "Must be a valid IPv4 CIDR block, for example 10.0.0.0/16."
    region:
      title: Region
      description: The cloud region that holds the network.
      type: string
      minLength: 1
    account_id:
      title: Account ID
      description: The subscription, project, or account that holds the network.
      type: string
    resource_group:
      title: Resource Group
      description: The Azure resource group that holds the network. Other clouds leave this empty.
      type: string
    subnets:
      title: Subnets
      description: The subnets of the network. A workload selects one by name.
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
          - cidr
        properties:
          id:
            title: ID
            description: The full identifier of the subnet in the cloud provider.
            type: string
            minLength: 1
          name:
            title: Name
            description: The name of the subnet.
            type: string
            minLength: 1
          cidr:
            title: CIDR
            description: The address range of the subnet, in CIDR notation.
            type: string
            pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
            message:
              pattern: "Must be a valid IPv4 CIDR block, for example 10.0.1.0/24."
          delegation:
            title: Delegation
            description: The cloud service that owns this subnet. An empty value means that the subnet is general purpose.
            type: string
    dns_servers:
      title: DNS Servers
      description: The custom resolvers of the network. An empty list means that the network uses the default resolver of the cloud provider.
      type: array
      items:
        type: string
