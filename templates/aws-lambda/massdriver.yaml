# Bundle YAML Spec: https://docs.massdriver.cloud/guides/bundle-yaml-spec
# Module Patterns: https://docs.massdriver.cloud/guides/module-patterns
# Bundle Templates: https://docs.massdriver.cloud/guides/bundle-templates

name: "{{ name }}"
description: "{{ description }}"
source_url: https://github.com/YOUR_ORG/YOUR_REPO/tree/main/bundles/{{ name }}
version: 0.0.0

steps:
  - path: src
    provisioner: opentofu

params:
  examples:
    - __name: Development
      region: us-east-1
      memory_mb: 128
      timeout_seconds: 10
      log_retention_days: 7
    - __name: Production
      region: us-east-1
      memory_mb: 512
      timeout_seconds: 30
      log_retention_days: 90
  required:
    - region
    - memory_mb
    - timeout_seconds
    - log_retention_days
  properties:
    region:
      title: Region
      description: AWS region the function is created in.
      type: string
      default: us-east-1
      $md.immutable: true
      oneOf:
        - const: us-east-1
          title: "US East (N. Virginia) — us-east-1"
        - const: us-east-2
          title: "US East (Ohio) — us-east-2"
        - const: us-west-2
          title: "US West (Oregon) — us-west-2"
        - const: eu-west-1
          title: "Europe (Ireland) — eu-west-1"
    memory_mb:
      title: Memory (MB)
      description: Memory allocated to the function. CPU scales with memory.
      type: integer
      default: 256
      oneOf:
        - const: 128
          title: "128 MB — cheapest"
        - const: 256
          title: "256 MB (recommended)"
        - const: 512
          title: "512 MB"
        - const: 1024
          title: "1 GB — CPU-heavy work"
    timeout_seconds:
      title: Timeout (seconds)
      description: How long one invocation may run before Lambda kills it.
      type: integer
      default: 10
      minimum: 1
      maximum: 900
    log_retention_days:
      title: Log Retention (days)
      description: How long CloudWatch keeps the function's logs.
      type: integer
      default: 30
      enum:
        - 1
        - 3
        - 7
        - 14
        - 30
        - 60
        - 90
        - 180
        - 365

# v2: shown in the product as "dependencies". The key in massdriver.yaml stays
# `connections:` until a backward-compatible rename ships.
connections:
{%- if connections.size > 0 %}
  required:
  {%- for conn in connections %}
    - {{ conn.name }}
  {%- endfor %}
  properties:
  {%- for conn in connections %}
    {{ conn.name }}:
      $ref: {{ conn.artifact_definition }}
  {%- endfor %}
{%- else %}
  required: []
  properties: {}
{%- endif %}

# v2: shown in the product as "resources". The key in massdriver.yaml stays
# `artifacts:` until a backward-compatible rename ships.
artifacts:
  properties: {}
  # Recommended: emit an `application` resource so other components (and
  # people) can find your API. Uncomment here and in src/_artifacts.tf:
  # required:
  #   - app
  # properties:
  #   app:
  #     $ref: application

ui:
  ui:order:
    - region
    - memory_mb
    - timeout_seconds
    - log_retention_days
    - "*"
  timeout_seconds:
    ui:widget: updown
    ui:help: "Callers of the function URL time out around 30s. Long-running work belongs in a queue, not a bigger timeout."
