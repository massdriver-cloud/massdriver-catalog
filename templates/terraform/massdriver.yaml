# Bundle YAML Spec: https://docs.massdriver.cloud/guides/bundle-yaml-spec
# Module Patterns: https://docs.massdriver.cloud/guides/module-patterns
# Bundle Templates: https://docs.massdriver.cloud/guides/bundle-templates

name: "{{ name }}"
description: "{{ description }}"
source_url: https://github.com/YOUR_ORG/YOUR_REPO/tree/main/bundles/{{ name }}
version: 0.0.0

steps:
  - path: src
    provisioner: terraform

params:
  examples:
    - __name: Development
      instance_name: dev-instance
      instance_count: 1
      enable_monitoring: false
    - __name: Production
      instance_name: prod-instance
      instance_count: 3
      enable_monitoring: true
  required:
    - instance_name
  properties:
    instance_name:
      type: string
      title: Instance Name
      description: A unique name for this instance
      minLength: 3
      maxLength: 63
    instance_count:
      type: integer
      title: Instance Count
      description: Number of instances to create
      default: 1
      minimum: 1
      maximum: 10
    enable_monitoring:
      type: boolean
      title: Enable Monitoring
      description: Enable monitoring for this instance
      default: false
    tags:
      type: array
      title: Tags
      description: Tags to apply to resources
      default: []
      items:
        type: string
    advanced:
      type: object
      title: Advanced Settings
      description: Advanced configuration options
      properties:
        timeout_seconds:
          type: integer
          title: Timeout
          description: Operation timeout in seconds
          default: 300
        retry_count:
          type: integer
          title: Retry Count
          description: Number of retries on failure
          default: 3

# dependencies: the resources this bundle consumes from other bundles.
# Each entry names a resource type and an optional version range
# (e.g. virtual-network@~1). Docs: https://docs.massdriver.cloud/bundle-development/bundle-yaml-spec
dependencies:
{%- if connections.size > 0 %}
  {%- for conn in connections %}
  {{ conn.name }}:
    resource_type: {{ conn.resourceType }}
    required: true
  {%- endfor %}
{%- else %} {}
{%- endif %}

# resources: what this bundle produces for other bundles to consume.
# Pin the exact resource type version the bundle emits (e.g. my-type@1.0.0).
resources: {}
  # my_resource:
  #   resource_type: your-resource-type@1.0.0
  #   required: true

ui:
  ui:order:
    - instance_name
    - instance_count
    - enable_monitoring
    - tags
    - advanced
    - "*"
