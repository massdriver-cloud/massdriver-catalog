name: gcp-firestore
description: >-
  A Firestore (Native mode) NoSQL document database for application data — user profiles, app state, anything
  you'd reach for a flexible, schema-less database for. Locked to standalone Firestore, no App Engine
  dependency, with optional point-in-time recovery and delete protection.
source_url: https://github.com/YOUR_ORG/massdriver-catalog/tree/main/bundles/gcp-firestore
version: 0.0.0

params:
  examples:
    - __name: Standard (recommended)
      location: "nam5"
      enable_point_in_time_recovery: true
      enable_delete_protection: true
    - __name: Low-cost / disposable
      location: "us-central1"
      enable_point_in_time_recovery: false
      enable_delete_protection: false
  required:
    - location
  properties:
    location:
      title: Location
      description: >-
        Where your data lives. The multi-region options spread your data across several regions for the best
        availability, and are the right choice unless you have a specific reason to keep data in one region. You
        cannot change this later.
      type: string
      default: "nam5"
      $md.immutable: true
      oneOf:
        - const: "nam5"
          title: "nam5 — multi-region (United States)"
        - const: "eur3"
          title: "eur3 — multi-region (Europe)"
        - const: "us-central1"
          title: "us-central1 — Iowa"
        - const: "us-east1"
          title: "us-east1 — South Carolina"
        - const: "us-east4"
          title: "us-east4 — Northern Virginia"
        - const: "us-west1"
          title: "us-west1 — Oregon"
        - const: "us-west2"
          title: "us-west2 — Los Angeles"
        - const: "europe-west1"
          title: "europe-west1 — Belgium"
        - const: "europe-west2"
          title: "europe-west2 — London"
        - const: "europe-west3"
          title: "europe-west3 — Frankfurt"
        - const: "asia-east1"
          title: "asia-east1 — Taiwan"
        - const: "asia-northeast1"
          title: "asia-northeast1 — Tokyo"
        - const: "asia-southeast1"
          title: "asia-southeast1 — Singapore"
        - const: "australia-southeast1"
          title: "australia-southeast1 — Sydney"
    enable_point_in_time_recovery:
      title: Keep A Rolling 7-Day Backup
      description: Lets you recover data from any moment in the last 7 days — handy if something gets deleted or overwritten by mistake. Roughly doubles the storage cost for the data it covers.
      type: boolean
      default: true
    enable_delete_protection:
      title: Prevent Accidental Deletion
      description: >-
        Blocks this database from being deleted — including by removing this component — until this is turned
        back off first. Recommended for anything that matters; only turn it off when you actually intend to
        delete the database.
      type: boolean
      default: true

dependencies:
  gcp_service_account:
    resource_type: gcp-service-account@0.0.0
    required: true

resources:
  database:
    resource_type: firestore-database@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10
    config:
      checkov:
        halt_on_failure: '.params.md_metadata.default_tags["md-target"] == "production"'

ui:
  ui:order:
    - location
    - enable_point_in_time_recovery
    - enable_delete_protection
    - "*"
  location:
    ui:help: "Match the region your Cloud Run service runs in for the fastest access, unless you need a specific single region."
  enable_delete_protection:
    ui:help: "If this is on, tearing down this component will fail until you redeploy with it turned off first."
