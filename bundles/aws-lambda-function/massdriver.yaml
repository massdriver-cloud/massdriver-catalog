name: aws-lambda-function
description: >-
  A serverless endpoint backed by a table — the most common shape an application takes here.
  Attach it to an API, give it a path, and it answers there. Add another for the next endpoint;
  the application's address never changes.
source_url: https://github.com/massdriver-cloud/massdriver-catalog/tree/main/bundles/aws-lambda-function
version: 0.0.0
icon: https://raw.githubusercontent.com/massdriver-cloud/massdriver-catalog/refs/heads/aws-citizen-developer-catalog/bundles/aws-lambda-function/icon.svg

params:
  examples:
    - __name: Development
      name: hello
      route: ANY /hello
      code_source: starter
      memory_mb: 512
      timeout_seconds: 10
      max_concurrent_executions: 25
      log_retention_days: 365
      attach_to_network: false
    - __name: Production
      name: orders
      route: ANY /orders/{proxy+}
      code_source: registry
      image_tag: latest
      memory_mb: 1024
      timeout_seconds: 30
      max_concurrent_executions: 50
      log_retention_days: 365
      attach_to_network: false
    - __name: Long-running
      name: reports
      route: POST /reports
      code_source: registry
      image_tag: latest
      memory_mb: 2048
      timeout_seconds: 120
      max_concurrent_executions: 10
      log_retention_days: 365
      attach_to_network: false
    - __name: Private network
      name: sync
      route: ANY /sync
      code_source: registry
      image_tag: latest
      memory_mb: 1024
      timeout_seconds: 30
      max_concurrent_executions: 25
      log_retention_days: 365
      attach_to_network: true
  required:
    - name
    - route
    - code_source
  properties:
    name:
      title: What should this endpoint be called?
      description: What it does, in a word. Shows up in logs and metrics.
      type: string
      minLength: 2
      maxLength: 32
      pattern: ^[a-z][a-z0-9-]*$
      message:
        pattern: "Lowercase letters, digits and hyphens only. Must start with a letter."
      $md.immutable: true
      examples:
        - hello
    route:
      title: What requests should reach it?
      description: >-
        A method and a path. Use `ANY` to take every method, and `{proxy+}` at the end to take
        everything below a path.
      type: string
      pattern: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|ANY) /.*$
      message:
        pattern: "A method then a path, for example `GET /hello` or `ANY /orders/{proxy+}`."
      default: GET /hello
      examples:
        - GET /hello
        - ANY /orders/{proxy+}
    code_source:
      title: What should it run?
      description: >-
        Start with the built-in example so the endpoint is live before you have written anything.
        Switch to your own image once your repository has built one.
      type: string
      default: starter
      oneOf:
        - const: starter
          title: The built-in example — works immediately, returns a fixed response
        - const: registry
          title: My team's image — from the registry in our landing zone
    image_tag:
      title: Which image?
      description: >-
        `latest` follows every build. Pin a commit instead when you want to know exactly what is
        running.
      type: string
      default: latest
      examples:
        - latest
    memory_mb:
      title: How much memory?
      description: >-
        CPU is handed out in proportion to this, so raising it often makes a slow function
        cheaper rather than dearer.
      type: integer
      default: 512
      oneOf:
        - const: 256
          title: 256 MB — small
        - const: 512
          title: 512 MB — the usual starting point
        - const: 1024
          title: 1 GB
        - const: 2048
          title: 2 GB
    timeout_seconds:
      title: How long may one request take?
      description: Anything slower is cut off. Keep it tight so a stuck request cannot pile up.
      type: integer
      default: 10
      minimum: 1
      maximum: 900
    max_concurrent_executions:
      title: How many requests may it handle at once?
      description: >-
        A ceiling, so one endpoint in a runaway loop cannot consume the whole account's capacity
        and take every other application down with it. Requests above this are refused rather
        than queued, so raise it if you expect real traffic.
      type: integer
      default: 25
      minimum: 1
      maximum: 900
    log_retention_days:
      title: How long should logs be kept?
      description: >-
        A year by default, because that is what most audits ask for and storing text is cheap.
        A shorter window in production is flagged as a compliance finding, so make it a decision
        rather than an accident.
      type: integer
      default: 365
      oneOf:
        - const: 7
          title: A week — throwaway environments
        - const: 30
          title: A month
        - const: 90
          title: Three months
        - const: 365
          title: A year — the usual answer
    attach_to_network:
      title: Does it need to reach private services?
      description: >-
        Off is faster to start, and the table it is connected to works either way. Turn it on
        only to reach something with a private address, and only when a landing zone is
        connected — without one there is no network to join.
      type: boolean
      default: false
    environment:
      title: Settings
      description: >-
        Values the code reads at startup. Never put passwords here — they are visible to anyone
        who can view the function.
      type: object
      default: {}
      additionalProperties:
        type: string

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  api:
    resource_type: http-api@0.0.0
    required: true
  table:
    resource_type: document-table@0.0.0
    required: true
  authorizer:
    resource_type: api-authorizer@0.0.0
    required: false
  landing_zone:
    resource_type: citizen-landing-zone@0.0.0
    required: false

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - name
    - route
    - code_source
    - image_tag
    - memory_mb
    - timeout_seconds
    - max_concurrent_executions
    - log_retention_days
    - attach_to_network
    - environment
    - "*"
  timeout_seconds:
    ui:widget: updown
  max_concurrent_executions:
    ui:widget: updown
