<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your site is live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 34rem; text-align: center; }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #34d399;
      border: 1px solid #34d399;
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 2.25rem; margin-bottom: 1rem; color: #f8fafc; }
    p { line-height: 1.6; color: #94a3b8; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1e293b;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Deployed</span>
    <h1>Your site is live</h1>
    <p>This sample page ships with the bundle. Replace the files in <code>src/site/</code> with your build output and redeploy to publish your own site.</p>
  </main>
</body>
</html>
