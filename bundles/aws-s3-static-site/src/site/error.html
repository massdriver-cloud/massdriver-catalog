<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 34rem; text-align: center; }
    .code { font-size: 4rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem; }
    h1 { font-size: 1.75rem; margin-bottom: 1rem; color: #f8fafc; }
    p { line-height: 1.6; color: #94a3b8; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That page doesn't exist here. Head <a href="/">back to the home page</a> and try again.</p>
  </main>
</body>
</html>
