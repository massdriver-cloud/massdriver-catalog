name: "tour-dates"
description: Keeps the show schedule in one place so nobody has to ask for the latest spreadsheet.
source_url: https://github.com/YOUR_ORG/massdriver-catalog/tree/main/bundles/tour-dates
version: 0.0.0

params:
  examples:
    - __name: Development
      service_name: "tour-dates"
      region: "us-central1"
      size: "small"
      min_instances: 0
      max_instances: 3
      public_access: false
      environment_variables: []
    - __name: Production
      service_name: "tour-dates"
      region: "us-central1"
      size: "medium"
      min_instances: 1
      max_instances: 10
      public_access: false
      environment_variables: []
  required:
    - service_name
    - region
    - size
    - min_instances
    - max_instances
  properties:
    service_name:
      title: Service Name
      description: What to call this service. Shows up in its URL and in logs. Cannot be changed after creation.
      type: string
      default: "tour-dates"
      minLength: 2
      maxLength: 40
      pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
      message:
        pattern: "2–40 lowercase letters, digits, or hyphens. Must start with a letter."
      $md.immutable: true
    region:
      title: Region
      description: Where this service runs. Pick the region closest to your users, and matching any database or storage it talks to.
      type: string
      default: "us-central1"
      oneOf:
        - const: "us-central1"
          title: "us-central1 — Iowa"
        - const: "us-east1"
          title: "us-east1 — South Carolina"
        - const: "us-east4"
          title: "us-east4 — Northern Virginia"
        - const: "us-west1"
          title: "us-west1 — Oregon"
        - const: "europe-west1"
          title: "europe-west1 — Belgium"
        - const: "europe-west3"
          title: "europe-west3 — Frankfurt"
        - const: "asia-southeast1"
          title: "asia-southeast1 — Singapore"
    size:
      title: Size
      description: How much CPU and memory each running copy of your app gets.
      type: string
      default: "small"
      oneOf:
        - const: "small"
          title: "Small — light traffic, simple apps"
        - const: "medium"
          title: "Medium — typical production app"
        - const: "large"
          title: "Large — heavier workloads, image/video processing"
    min_instances:
      title: Minimum Copies Always Running
      description: 0 means your app can go to sleep when nobody's using it — cheapest, but the next visitor waits a few seconds for it to wake up. 1 or more keeps it always warm.
      type: integer
      default: 0
      minimum: 0
      maximum: 10
    max_instances:
      title: Maximum Copies Under Load
      description: Caps how many copies can run at once during a traffic spike. This is your spending ceiling — each copy costs roughly the same as one always-on instance.
      type: integer
      default: 3
      minimum: 1
      maximum: 50
    public_access:
      title: Anyone On The Internet Can Reach This
      description: Off by default. Turn this on only if this app should be reachable by anyone with the URL, with no login required. Leave it off for internal tools and anything with sensitive data.
      type: boolean
      default: false
    environment_variables:
      title: App Settings
      description: Configuration values your app reads at startup. Not for passwords or secrets — connect a database or storage bundle for those.
      type: array
      default: []
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
            title: Name
            pattern: ^[A-Z][A-Z0-9_]*$
            message:
              pattern: "Uppercase letters, digits, and underscores, starting with a letter — e.g. FEATURE_FLAG."
          value:
            type: string
            title: Value

dependencies:
  gcp_service_account:
    resource_type: gcp-service-account@0.0.0
    required: true
  container_registry:
    resource_type: container-registry@0.0.0
    required: true
  vpc_connector:
    resource_type: serverless-connector@0.0.0
    required: false
  database:
    resource_type: postgres-schema@0.0.0
    required: false

resources:
  service:
    resource_type: cloud-run-service@0.0.0
    required: true

steps:
  - path: build
    provisioner: opentofu:1.10
    config:
      checkov:
        halt_on_failure: '.params.md_metadata.default_tags["md-target"] == "production"'
  - path: deploy
    provisioner: opentofu:1.10
    config:
      checkov:
        halt_on_failure: '.params.md_metadata.default_tags["md-target"] == "production"'

ui:
  ui:order:
    - service_name
    - region
    - size
    - min_instances
    - max_instances
    - public_access
    - environment_variables
    - "*"
  min_instances:
    ui:widget: updown
    ui:help: "0 saves the most money. 1+ avoids the few-second wake-up delay on the first request after idle."
  max_instances:
    ui:widget: updown
  environment_variables:
    ui:options:
      orderable: false
      addable: true
      removable: true
