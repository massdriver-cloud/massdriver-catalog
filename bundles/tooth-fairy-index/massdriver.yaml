# Bundle YAML Spec: https://docs.massdriver.cloud/guides/bundle-yaml-spec
#
# Scaffolded from templates/gcp-cloud-run. The Tooth Fairy Rate Index: an anonymous campaign
# site where visitors report what the tooth fairy pays at their house and see the national
# average, a state-by-state view, and how the rate has changed over time.

name: "tooth-fairy-index"
description: >-
  A fun, anonymous campaign web app. Visitors submit what the tooth fairy pays at their house
  and their zip code (converted to a state and discarded — the zip itself is never stored), and
  see a live national average, a state-by-state breakdown, and a chart of how the rate has
  changed over time.
source_url: https://github.com/YOUR_ORG/massdriver-catalog/tree/main/bundles/tooth-fairy-index
version: 0.1.0

params:
  examples:
    - __name: Development
      service_name: "tooth-fairy-index"
      region: "us-central1"
      size: "small"
      min_instances: 0
      max_instances: 3
      public_access: true
      environment_variables: []
    - __name: Production
      service_name: "tooth-fairy-index"
      region: "us-central1"
      size: "medium"
      min_instances: 1
      max_instances: 10
      public_access: true
      environment_variables: []
  required:
    - service_name
    - region
    - size
    - min_instances
    - max_instances
  properties:
    service_name:
      title: Service Name
      description: What to call this service. Shows up in its URL and in logs. Cannot be changed after creation.
      type: string
      default: "tooth-fairy-index"
      minLength: 2
      maxLength: 40
      pattern: ^[a-z][a-z0-9-]*[a-z0-9]$
      message:
        pattern: "2–40 lowercase letters, digits, or hyphens. Must start with a letter."
      $md.immutable: true
    region:
      title: Region
      description: Where this service runs. Pick the region closest to your users, and matching any database or storage it talks to.
      type: string
      default: "us-central1"
      oneOf:
        - const: "us-central1"
          title: "us-central1 — Iowa"
        - const: "us-east1"
          title: "us-east1 — South Carolina"
        - const: "us-east4"
          title: "us-east4 — Northern Virginia"
        - const: "us-west1"
          title: "us-west1 — Oregon"
        - const: "europe-west1"
          title: "europe-west1 — Belgium"
        - const: "europe-west3"
          title: "europe-west3 — Frankfurt"
        - const: "asia-southeast1"
          title: "asia-southeast1 — Singapore"
    size:
      title: Size
      description: How much CPU and memory each running copy of your app gets.
      type: string
      default: "small"
      oneOf:
        - const: "small"
          title: "Small — light traffic, simple apps"
        - const: "medium"
          title: "Medium — typical production app"
        - const: "large"
          title: "Large — heavier workloads, image/video processing"
    min_instances:
      title: Minimum Copies Always Running
      description: 0 means your app can go to sleep when nobody's using it — cheapest, but the next visitor waits a few seconds for it to wake up. 1 or more keeps it always warm.
      type: integer
      default: 0
      minimum: 0
      maximum: 10
    max_instances:
      title: Maximum Copies Under Load
      description: Caps how many copies can run at once during a traffic spike. This is your spending ceiling — each copy costs roughly the same as one always-on instance.
      type: integer
      default: 3
      minimum: 1
      maximum: 50
    public_access:
      title: Anyone On The Internet Can Reach This
      description: >-
        On by default for this app — it's a public campaign site with a link meant to be shared.
        Everything it collects is anonymous (state + amount only, never a name, email, or zip
        code), so there's nothing sensitive behind this endpoint.
      type: boolean
      default: true
    posthog_project_key:
      title: PostHog Project Key
      description: >-
        Optional. Paste your PostHog project key to turn on analytics. Leave it empty and no
        analytics script loads at all.
      type: string
      default: ""
      pattern: ^$|^phc_[A-Za-z0-9]{20,}$
      message:
        pattern: 'Either empty (analytics off), or a PostHog project key starting with "phc_".'
    posthog_api_host:
      title: PostHog Address
      description: Where the browser sends analytics events. Leave this alone unless PostHog told you otherwise.
      type: string
      default: "https://g.massdriver.cloud"
      pattern: ^https://[a-z0-9.-]+$
      message:
        pattern: "An https:// address, e.g. https://g.massdriver.cloud"
    environment_variables:
      title: App Settings
      description: Configuration values your app reads at startup. Not for passwords or secrets — connect a database or storage bundle for those.
      type: array
      default: []
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            type: string
            title: Name
            pattern: ^[A-Z][A-Z0-9_]*$
            message:
              pattern: "Uppercase letters, digits, and underscores, starting with a letter — e.g. FEATURE_FLAG."
          value:
            type: string
            title: Value

# This app stores its data in Firestore. The gcp-cloud-run template also offers
# Postgres, object storage, and a serverless VPC connector. This bundle removes
# those connections, because this app does not use them.
connections:
  required:
    - gcp_service_account
    - container_registry
    - firestore
  properties:
    gcp_service_account:
      $ref: gcp-service-account
      title: GCP Service Account
    container_registry:
      $ref: container-registry
      title: Container Registry
    firestore:
      $ref: firestore-database
      title: Firestore

artifacts:
  required:
    - service
  properties:
    service:
      $ref: cloud-run-service
      title: Cloud Run Service

steps:
  - path: build
    provisioner: opentofu:1.10
    config:
      checkov:
        halt_on_failure: '.params.md_metadata.default_tags["md-target"] == "production"'
  - path: deploy
    provisioner: opentofu:1.10
    config:
      checkov:
        halt_on_failure: '.params.md_metadata.default_tags["md-target"] == "production"'

ui:
  ui:order:
    - service_name
    - region
    - size
    - min_instances
    - max_instances
    - public_access
    - environment_variables
    - "*"
  min_instances:
    ui:widget: updown
    ui:help: "0 saves the most money. 1+ avoids the few-second wake-up delay on the first request after idle."
  max_instances:
    ui:widget: updown
  environment_variables:
    ui:options:
      orderable: false
      addable: true
      removable: true
