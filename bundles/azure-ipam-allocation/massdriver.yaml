name: azure-ipam-allocation
description: Records an address range for one network and registers it with the external IP address management system.
source_url: https://github.com/massdriver-cloud/massdriver-catalog/tree/example/0921-azure-landing-zones/bundles/azure-ipam-allocation
version: 0.0.0

params:
  examples:
    - __name: Development
      cidr: "10.10.0.0/16"
      pool: corp-nonprod
      region: eastus
      register_with_ipam: false
    - __name: Production
      cidr: "10.30.0.0/16"
      pool: corp-prod
      region: eastus2
      register_with_ipam: true
      ipam_endpoint: "https://ipam.internal.example.com/api/v1/allocations"
  required:
    - cidr
    - pool
    - region
  properties:
    cidr:
      type: string
      title: CIDR
      description: The address range that the management system reserved for this network. Do not pick a range by hand.
      pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/(1[0-9]|2[0-4])$
      message:
        pattern: "Must be a private IPv4 CIDR block between /10 and /24, for example 10.10.0.0/16."
      $md.immutable: true
      examples:
        - "10.10.0.0/16"
    pool:
      type: string
      title: Pool
      description: The name of the parent pool in the management system.
      minLength: 1
      $md.immutable: true
      examples:
        - corp-prod
        - corp-nonprod
    region:
      type: string
      title: Region
      description: The region that the range serves.
      default: eastus
      oneOf:
        - const: eastus
          title: East US (Virginia)
        - const: eastus2
          title: East US 2 (Virginia)
        - const: centralus
          title: Central US (Iowa)
        - const: westus2
          title: West US 2 (Washington)
        - const: westus3
          title: West US 3 (Arizona)
        - const: northeurope
          title: North Europe (Ireland)
        - const: westeurope
          title: West Europe (Netherlands)
    register_with_ipam:
      type: boolean
      title: Register the Range
      description: Write the range back to the management system. Turn this off while the endpoint is not ready.
      default: false
    ipam_endpoint:
      type: string
      title: IPAM Endpoint
      description: The address that accepts the registration. The bundle sends a POST request to it.
      default: ""
      pattern: ^$|^https://
      message:
        pattern: "Must start with https://, or be empty."
    allocation_id:
      type: string
      title: Allocation ID
      description: The record identifier from the management system. Leave it empty when the system creates one.
      default: ""

dependencies: {}

resources:
  allocation:
    resource_type: network-allocation@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - cidr
    - pool
    - region
    - register_with_ipam
    - ipam_endpoint
    - allocation_id
    - "*"
  cidr:
    ui:help: "Warning: two networks with the same range cannot route to each other. Reserve the range in the management system first."
  register_with_ipam:
    ui:help: "Turn this on after the platform team opens the endpoint to Massdriver."
  ipam_endpoint:
    ui:placeholder: "https://ipam.internal.example.com/api/v1/allocations"
