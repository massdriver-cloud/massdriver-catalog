name: aws-eks-cluster
description: >-
  Amazon EKS cluster with worker nodes in private subnets, an IAM OIDC
  provider for IRSA, and the AWS Load Balancer Controller, which provisions
  an ACM-backed TLS load balancer for each app Ingress. Apps share one
  cluster and one node pool.
source_url: https://github.com/YOUR_ORG/YOUR_REPO/tree/main/bundles/aws-eks-cluster
version: 0.1.0

params:
  examples:
    - __name: Development (small nodes, open API endpoint)
      cluster_version: "1.31"
      node_instance_size: "s"
      node_desired_size: 2
      node_min_size: 2
      node_max_size: 4
      endpoint_public_access: true
      public_access_cidrs:
        - "0.0.0.0/0"
      acm_certificate_arn: ""
    - __name: Production (bigger nodes, restricted API endpoint)
      cluster_version: "1.31"
      node_instance_size: "m"
      node_desired_size: 3
      node_min_size: 3
      node_max_size: 8
      endpoint_public_access: true
      public_access_cidrs:
        - "203.0.113.0/24"
      acm_certificate_arn: "arn:aws:acm:us-east-1:123456789012:certificate/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
  required:
    - cluster_version
    - node_instance_size
    - node_desired_size
    - node_min_size
    - node_max_size
    - endpoint_public_access
    - public_access_cidrs
  properties:
    cluster_version:
      type: string
      title: Kubernetes Version
      description: EKS control plane version.
      default: "1.31"
      oneOf:
        - const: "1.29"
          title: "1.29"
        - const: "1.30"
          title: "1.30"
        - const: "1.31"
          title: "1.31 (current)"
        - const: "1.32"
          title: "1.32"
    node_instance_size:
      type: string
      title: Node Instance Size
      description: T-shirt size mapped to an EC2 instance type for worker nodes.
      default: "s"
      oneOf:
        - const: "s"
          title: "Small — t3.medium (2 vCPU, 4 GiB)"
        - const: "m"
          title: "Medium — t3.large (2 vCPU, 8 GiB)"
        - const: "l"
          title: "Large — m6i.xlarge (4 vCPU, 16 GiB)"
    node_desired_size:
      type: integer
      title: Desired Node Count
      description: Initial node count for the shared node group.
      default: 2
      minimum: 1
      maximum: 20
    node_min_size:
      type: integer
      title: Minimum Node Count
      default: 2
      minimum: 1
      maximum: 20
    node_max_size:
      type: integer
      title: Maximum Node Count
      description: Maximum node count the node group can scale up to.
      default: 4
      minimum: 1
      maximum: 40
    endpoint_public_access:
      type: boolean
      title: Public API Endpoint
      description: Allow the Kubernetes API endpoint to be reached from outside the VPC. Access is IAM-authenticated regardless of this setting.
      default: true
    public_access_cidrs:
      type: array
      title: Allowed Public CIDRs
      description: CIDR blocks allowed to reach the public API endpoint, when it is enabled.
      default:
        - "0.0.0.0/0"
      minItems: 1
      items:
        type: string
        pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]{1,2}$
        message:
          pattern: "Must be a valid IPv4 CIDR block."
    acm_certificate_arn:
      type: string
      title: Ingress ACM Certificate ARN
      description: >-
        Existing ACM certificate ARN the ingress controller uses to
        terminate TLS at each app's load balancer. Leave blank to serve
        ingress over HTTP only.
      default: ""

dependencies:
  endpoint_public_access:
    oneOf:
      - properties:
          endpoint_public_access:
            const: false
      - properties:
          endpoint_public_access:
            const: true
        required:
          - public_access_cidrs

# v2: shown in the product as "dependencies". The key in massdriver.yaml stays
# `connections:` until a backward-compatible rename ships.
connections:
  required:
    - aws_authentication
    - network
  properties:
    aws_authentication:
      $ref: aws-iam-role
      title: AWS Authentication
    network:
      $ref: aws-network
      title: AWS Network

# v2: shown in the product as "resources". The key in massdriver.yaml stays
# `artifacts:` until a backward-compatible rename ships.
artifacts:
  required:
    - cluster
  properties:
    cluster:
      $ref: kubernetes-cluster
      title: Kubernetes Cluster

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - cluster_version
    - node_instance_size
    - node_desired_size
    - node_min_size
    - node_max_size
    - endpoint_public_access
    - public_access_cidrs
    - acm_certificate_arn
    - "*"
  cluster_version:
    ui:help: "Upgrades are applied in place, one minor version at a time."
  node_instance_size:
    ui:help: "All apps on this cluster share this node pool."
  endpoint_public_access:
    ui:help: "When disabled, the API endpoint is reachable only from inside the VPC, for example over a VPN or bastion."
  public_access_cidrs:
    ui:options:
      orderable: true
      addable: true
      removable: true
  acm_certificate_arn:
    ui:help: "The certificate must already be issued and DNS-validated in ACM."
    ui:placeholder: "arn:aws:acm:us-east-1:123456789012:certificate/..."
