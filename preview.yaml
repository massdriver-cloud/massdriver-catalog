# Required: the project the preview env lives in.
project: fancy

# Required: the local segment of the env to fork from. The full parent
# identifier is `<project>-<baseEnvironment>` → `fancy-production`.
baseEnvironment: production

# Optional fork-level macros. Default false.
copyEnvironmentDefaults: false   # carry the parent's default resources over
copySecrets: false                # fan copyInstance(copySecrets: true) to every instance
copyRemoteReferences: false      # fan copyInstance(copyRemoteReferences: true) to every instance

# Optional. Required when the org declares attributes at the environment scope.
# Both keys and values must be strings. Overridden by `-a/--attributes` flag.
# These are completely customizable organization environment attributes from our ABAC system.
attributes:
  environmentLifecycle: preview
  branch: "${GITHUB_PR}"
  region: us-east-1

# Optional: pin specific resources as defaults for this env, instead of cloning
# them. Previews should reuse the shared EKS cluster and ECR repo rather than
# spend 20 minutes (and ~$73/mo) creating their own. `resourceType` is
# documentation for the reader; the CLI only sends `resourceId` to the API.
environmentDefaults:
  - resourceType: kubernetes-cluster
    resourceId: shared-produse1-eks.cluster
  - resourceType: container-registry
    resourceId: shared-produse1-ecr.registry

# Optional: per-instance overrides. Listed instances with no overrides just
# inherit from the fork's seed. Valid keys per instance: version, params, secrets.
# Instance keys are the local segment of the instance ID (the part after
# `<project>-<baseEnvironment>-`), as listed by `mass instance list fancy-production`.
instances:
  wordpress:
    version: "latest+dev"   # `+dev` pulls from the development channel
    params:
      blog_title: "PR ${GITHUB_PR} Preview"
      replicas: 1
      service_type: ClusterIP
    secrets:
      - name: WORDPRESS_ADMIN_PASSWORD
        value: preview-only-password-rotate-me

  mariadb:
    version: "latest+dev"
    params:
      instance_size: xs
      backup_retention_days: 0
      high_availability: false

  # listed without overrides — inherit from the fork
  # vpc:
  # pg:
